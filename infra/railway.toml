# Railway config for the AI service (Python + FastAPI).
# See docs/BUILD.md §6 / §7 — this service owns the 4-stage render pipeline.

[build]
builder = "NIXPACKS"
buildCommand = "pip install -e apps/ai-service[dev]"

[deploy]
startCommand = "uvicorn apps.ai-service.src.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/healthz"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
