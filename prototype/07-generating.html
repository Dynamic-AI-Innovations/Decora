<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>07 · Generating — Decora</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="stage">
    <div class="stage-meta">07 · Generating <a href="index.html">← all screens</a></div>

    <div class="phone">
      <div class="phone-header">
        <span>9:47</span>
        <span class="icons">●●●●</span>
      </div>

      <div class="phone-content phone-padded" style="background: radial-gradient(ellipse 80% 50% at 50% 30%, rgba(212, 90, 44, 0.14), transparent 70%);">
        <div class="row-between">
          <a class="btn btn-link">Cancel</a>
          <span class="label naira">~42s</span>
        </div>

        <div class="mt-8 text-center">
          <div class="orb">
            <div class="orb-glow"></div>
          </div>

          <div class="mt-8">
            <h1 class="display-sm">Designing.</h1>
            <p class="subtitle mt-2">Afro-Contemporary · ₦500K</p>
          </div>
        </div>

        <div class="mt-auto" style="padding: 24px 0;">
          <div class="pipeline">
            <div class="pipeline-step done">
              <div class="dot"></div>
              <div class="label-text">Read the room</div>
            </div>
            <div class="pipeline-step done">
              <div class="dot"></div>
              <div class="label-text">Composed the brief</div>
            </div>
            <div class="pipeline-step active">
              <div class="dot"></div>
              <div class="label-text">Rendering 3 variants</div>
            </div>
            <div class="pipeline-step">
              <div class="dot"></div>
              <div class="label-text">Pricing in Naira</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
