<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>12 · Forgot password — Decora</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="stage">
    <div class="stage-meta">12 · Reset password <a href="index.html">← all screens</a></div>

    <div class="phone">
      <div class="phone-header">
        <span>9:40</span>
        <span class="icons">●●●●</span>
      </div>

      <div class="phone-content">
        <div class="scene scene-modern-ph scene-noise" style="position:absolute; inset:0;">
          <div class="scene-window"></div>
        </div>

        <div style="position:relative; padding:20px 24px;">
          <a class="btn btn-glass btn-icon" href="11-login.html">←</a>
        </div>

        <div class="auth-card">
          <div>
            <span class="eyebrow">Forgot it?</span>
            <h1 class="title mt-3">No worries.<br/>We'll send a link.</h1>
            <p class="body mt-3" style="font-size:13px;">Enter your email and we'll send a one-tap reset link.</p>
          </div>

          <div class="col gap-2">
            <div class="input-row">
              <span class="input-icon">✉</span>
              <input class="input" type="email" placeholder="you@email.com" />
            </div>
          </div>

          <a class="btn btn-primary btn-block">Send reset link</a>

          <p class="body text-center" style="font-size:11px;">
            Remembered it? <a href="11-login.html" class="text-brand" style="font-weight:600;">Back to sign in</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
