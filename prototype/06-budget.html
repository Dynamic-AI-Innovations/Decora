<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>06 · Budget — Decora</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="stage">
    <div class="stage-meta">06 · Naira budget <a href="index.html">← all screens</a></div>

    <div class="phone">
      <div class="phone-header">
        <span>9:46</span>
        <span class="icons">●●●●</span>
      </div>

      <div class="phone-content phone-padded">
        <div class="row-between">
          <a class="btn btn-link" href="05-style-picker.html">←</a>
          <div class="progress" style="flex:1; max-width:120px;"><div class="bar" style="width: 75%"></div></div>
          <span class="label">3 / 4</span>
        </div>

        <div class="mt-8 text-center">
          <span class="eyebrow-muted">Budget</span>
          <div class="naira mt-3" style="font-family:'Fraunces',serif; font-size:64px; font-weight:300; letter-spacing:-0.035em; line-height:1; color:var(--fg);">
            ₦500,000
          </div>
          <p class="body mt-3">Mid-range · plenty for a parlour</p>
        </div>

        <div class="mt-8" style="position:relative;">
          <div style="height:3px; background:var(--surface-2); border-radius:99px; position:relative;">
            <div style="height:100%; width:34%; background:var(--brand); border-radius:99px;"></div>
            <div style="position:absolute; top:50%; left:34%; transform:translate(-50%,-50%); width:24px; height:24px; background:white; border-radius:50%; box-shadow:0 4px 14px rgba(0,0,0,0.4);"></div>
          </div>
          <div class="row-between mt-3 label">
            <span>₦50K</span><span>₦5M+</span>
          </div>
        </div>

        <div class="row mt-6 gap-2" style="justify-content:center; flex-wrap:wrap;">
          <span class="chip">₦100K</span>
          <span class="chip">₦250K</span>
          <span class="chip chip-active">₦500K</span>
          <span class="chip">₦1M</span>
          <span class="chip">₦2M+</span>
        </div>

        <a class="btn btn-primary btn-block mt-auto" href="07-generating.html">Design my parlour</a>
      </div>
    </div>
  </div>
</body>
</html>
