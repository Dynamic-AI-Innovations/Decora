<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>03 · Upload — Decora</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="stage">
    <div class="stage-meta">03 · Capture a room <a href="index.html">← all screens</a></div>

    <div class="phone">
      <div class="phone-header">
        <span>9:43</span>
        <span class="icons">●●●●</span>
      </div>

      <div class="phone-content">
        <div class="hero" style="height: 560px;">
          <div class="scene scene-before scene-noise" style="position:absolute; inset:0;">
            <div class="scene-window"></div>
          </div>

          <div class="hero-overlay-top">
            <div class="row-between">
              <a class="btn btn-glass btn-icon">✕</a>
              <span class="chip chip-glass">Auto</span>
              <a class="btn btn-glass btn-icon">⚡</a>
            </div>
          </div>

          <div class="hero-overlay" style="padding:80px 24px 28px;">
            <div class="row-between" style="align-items:flex-end;">
              <a class="btn btn-glass btn-icon" style="width:54px;height:54px;font-size:18px;">🖼</a>
              <a class="btn btn-capture" href="04-room-confirm.html"></a>
              <a class="btn btn-glass btn-icon" style="width:54px;height:54px;font-size:18px;">⟳</a>
            </div>
            <div class="text-center mt-4">
              <span class="chip chip-glass" style="font-size:11px;">Fill the frame with the whole room</span>
            </div>
          </div>
        </div>

        <div class="phone-padded" style="padding-top:18px;">
          <div class="row-between">
            <span class="label">Recent</span>
            <a class="btn-link">See all</a>
          </div>
          <div class="row mt-3 gap-3" style="overflow-x:auto;">
            <div class="scene scene-afro scene-noise" style="width:96px;height:124px;border-radius:14px;flex-shrink:0;border:1px solid var(--border);"></div>
            <div class="scene scene-yoruba scene-noise" style="width:96px;height:124px;border-radius:14px;flex-shrink:0;border:1px solid var(--border);"></div>
            <div class="scene scene-lagos scene-noise" style="width:96px;height:124px;border-radius:14px;flex-shrink:0;border:1px solid var(--border);"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
