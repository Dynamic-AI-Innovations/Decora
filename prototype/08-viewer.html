<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>08 · Render viewer — Decora</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="stage">
    <div class="stage-meta">08 · Render + budget <a href="index.html">← all screens</a></div>

    <div class="phone">
      <div class="phone-header">
        <span>9:48</span>
        <span class="icons">●●●●</span>
      </div>

      <div class="phone-content" style="position:relative;">
        <div class="hero" style="height: 100%; position:absolute; inset:0;">
          <div class="compare" style="height:100%;">
            <div class="layer scene scene-before scene-noise"></div>
            <div class="layer after scene scene-afro scene-noise">
              <div class="scene-window"></div>
            </div>
            <div class="divider"></div>
            <div class="handle">⇆</div>
            <span class="label-tag label-before">Before</span>
            <span class="label-tag label-after">After</span>
          </div>

          <div class="hero-overlay-top" style="padding: 18px 20px 60px;">
            <div class="row-between">
              <a class="btn btn-glass btn-icon">←</a>
              <span class="chip chip-glass">Variant 1 of 3</span>
              <a class="btn btn-glass btn-icon">⋯</a>
            </div>
          </div>

          <span class="tag-pill" style="top: 32%; left: 14%;">
            <span class="tag-thumb">🛋️</span>
            <span class="tag-name">Sectional</span>
            <span class="tag-price">₦248K</span>
          </span>
          <span class="tag-pill" style="top: 20%; right: 16%;">
            <span class="tag-thumb">🪔</span>
            <span class="tag-name">Pendant</span>
            <span class="tag-price">₦18.5K</span>
          </span>
          <span class="tag-pill" style="bottom: 32%; right: 18%;">
            <span class="tag-thumb">🌿</span>
            <span class="tag-name">Plant</span>
            <span class="tag-price">₦22K</span>
          </span>

          <div class="sheet">
            <div class="sheet-handle"></div>
            <div class="row-between">
              <div class="col">
                <span class="label">Estimated total · 11 items</span>
                <div class="naira mt-1" style="font-family:'Fraunces',serif; font-size:34px; font-weight:400; letter-spacing:-0.025em; line-height:1;">₦458,500</div>
                <div class="body mt-1" style="font-size:12px;">of ₦500K budget</div>
              </div>
              <span class="pill pill-success">Inside</span>
            </div>
            <div class="row mt-4 gap-2">
              <a class="btn btn-secondary" style="flex:1; padding:14px 20px;">Save</a>
              <a class="btn btn-primary" style="flex:1.6; padding:14px 20px;">Share to WhatsApp</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
