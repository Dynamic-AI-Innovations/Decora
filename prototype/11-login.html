<!doctype html>
<html lang="en">

  <div class="stage">

          <div class="divider-text">or</div>

          <div class="col gap-2">
            <div class="input-row">
              <span class="input-icon">✉</span>
              <input class="input" type="email" placeholder="you@email.com" value="adebayo@gmail.com" />
            </div>
            <div class="input-row">
              <span class="input-icon">⚿</span>
              <input class="input" type="password" placeholder="Password" value="••••••••••" />
            </div>
            <div class="text-center" style="margin-top:4px;">
