<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>05 · Style picker — Decora</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="stage">
    <div class="stage-meta">05 · Pick a style <a href="index.html">← all screens</a></div>

    <div class="phone">
      <div class="phone-header">
        <span>9:45</span>
        <span class="icons">●●●●</span>
      </div>

      <div class="phone-content phone-padded">
        <div class="row-between">
          <a class="btn btn-link" href="04-room-confirm.html">←</a>
          <div class="progress" style="flex:1; max-width:120px;"><div class="bar" style="width: 50%"></div></div>
          <span class="label">2 / 4</span>
        </div>

        <div class="mt-6">
          <h1 class="title">A style for<br/>your parlour.</h1>
        </div>

        <div class="grid-2 mt-5">
          <div class="style-tile active scene scene-afro scene-noise">
            <div class="scene-window"></div>
            <div class="style-tile-label">
              <div class="style-tile-name">Afro-Contemporary</div>
            </div>
          </div>
          <div class="style-tile scene scene-lagos scene-noise">
            <div class="scene-window"></div>
            <div class="style-tile-label">
              <div class="style-tile-name">Lagos Minimalist</div>
            </div>
          </div>
          <div class="style-tile scene scene-abuja scene-noise">
            <div class="style-tile-label">
              <div class="style-tile-name">Abuja Executive</div>
            </div>
          </div>
          <div class="style-tile scene scene-yoruba scene-noise">
            <div class="style-tile-label">
              <div class="style-tile-name">Yoruba Heritage</div>
            </div>
          </div>
          <div class="style-tile scene scene-diaspora scene-noise">
            <div class="style-tile-label">
              <div class="style-tile-name">Diaspora Returnee</div>
            </div>
          </div>
          <div class="style-tile scene scene-tropical scene-noise">
            <div class="style-tile-label">
              <div class="style-tile-name">Tropical Luxe</div>
            </div>
          </div>
          <div class="style-tile scene scene-old-naija scene-noise">
            <div class="style-tile-label">
              <div class="style-tile-name">Old Naija Comfort</div>
            </div>
          </div>
          <div class="style-tile scene scene-modern-ph scene-noise">
            <div class="style-tile-label">
              <div class="style-tile-name">Modern PH</div>
            </div>
          </div>
        </div>

        <a class="btn btn-primary btn-block mt-6" href="06-budget.html">Continue</a>
      </div>
    </div>
  </div>
</body>
</html>
