<!doctype html>
<html lang="en">
<head>

  <title>01 · Landing — Decora</title>

</head>
<body>
  <div class="stage">
    <div class="stage-meta">01 · Landing <a href="index.html">← all screens</a></div>

    <div class="phone">

        <span>9:41</span>
        <span class="icons">●●●●</span>
      </div>

      <div class="phone-content">
        <div class="hero" style="height: 540px;">
          <div class="compare" style="height: 100%;">

            <div class="layer after scene scene-afro scene-noise">

            <div class="handle">⇆</div>
            <span class="label-tag label-before">Before</span>
            <span class="label-tag label-after">After</span>

          <div class="hero-overlay-top">

              <div class="logo">Decora<span class="dot">.</span></div>

          </div>
        </div>

        <div class="phone-padded">
          <div class="mt-6">
            <h1 class="display-sm">Your home,<br/>reimagined.</h1>
            <p class="subtitle mt-4">AI interior design for Nigerian homes — itemised in Naira.</p>
          </div>

          <div class="mt-auto">
            <a class="btn btn-primary btn-block" href="10-signup.html">Start designing</a>
            <p class="body text-center mt-3">Founding pricing · <span class="text-brand">316 spots left</span></p>
          </div>
        </div>
      </div>
    </div>
