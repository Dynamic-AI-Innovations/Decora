[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "decora-ai-service"
version = "0.1.0"
description = "Decora render pipeline — Stage 1 (room intel) → 2 (prompt) → 3 (image) → 4 (budget)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "anthropic>=0.39.0",
    "replicate>=0.34.0",
    "redis>=5.1.0",
    "supabase>=2.9.0",
    "Pillow>=10.4.0",
    "structlog>=24.4.0",
    "sentry-sdk[fastapi]>=2.16.0",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "W", "UP", "N"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/pipeline/stages/*.py" = ["ARG001"]  # Stub functions; args wired in their target week.
"tests/*.py" = ["S101"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
